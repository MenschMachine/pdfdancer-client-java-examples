name: Daily Examples Test

on:
  # Run daily at 2 AM UTC
  schedule:
    - cron: '30 4 * * *'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  test-examples:
    name: Run Examples (Java ${{ matrix.java-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java-version: ['21', '22', '23']

    env:
      PDFDANCER_BASE_URL: https://api-staging.pdfdancer.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
          cache: 'gradle'

      - name: Grant execute permission for gradlew (Unix)
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build project
        run: ./gradlew build

      - name: Run All Examples
        run: ./gradlew runAllExamples
