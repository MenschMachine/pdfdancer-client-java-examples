name: Daily Examples Test

on:
  # Run daily at 2 AM UTC
  schedule:
    - cron: '30 4 * * *'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  test-examples:
    name: Run Examples (Java ${{ matrix.java-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java-version: ['11', '17', '21', '25']

    env:
      PDFDANCER_BASE_URL: https://api-staging.pdfdancer.com
      JAVA_VERSION: ${{ matrix.java-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17 (to run Gradle 9.x)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Save Java 17 path
        id: java17
        run: echo "path=$JAVA_HOME" >> $GITHUB_OUTPUT

      - name: Set up Java ${{ matrix.java-version }} (to run examples)
        if: matrix.java-version != '17'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}

      - name: Grant execute permission for gradlew (Unix)
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build project
        run: ./gradlew build
        env:
          JAVA_HOME: ${{ steps.java17.outputs.path }}

      - name: Run All Examples
        run: ./gradlew runAllExamples
