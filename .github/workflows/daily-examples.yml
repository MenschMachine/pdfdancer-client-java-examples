name: Daily Examples Test

on:
  # Run daily at 2 AM UTC
  schedule:
    - cron: '30 4 * * *'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  select-random:
    name: Select Random Test Combination
    runs-on: ubuntu-latest
    outputs:
      java-version: ${{ steps.random.outputs.java-version }}
      os: ${{ steps.random.outputs.os }}
    steps:
      - name: Select random combination
        id: random
        run: |
          # All possible Java versions
          JAVA_VERSIONS=("11" "17" "21" "25")
          # All possible OS (macos-latest removed per remote changes)
          OS_OPTIONS=("ubuntu-latest" "windows-latest")

          # Select random Java version
          RANDOM_JAVA=${JAVA_VERSIONS[$RANDOM % ${#JAVA_VERSIONS[@]}]}

          # Select random OS
          RANDOM_OS=${OS_OPTIONS[$RANDOM % ${#OS_OPTIONS[@]}]}

          echo "java-version=$RANDOM_JAVA" >> $GITHUB_OUTPUT
          echo "os=$RANDOM_OS" >> $GITHUB_OUTPUT

          echo "Selected: Java $RANDOM_JAVA on $RANDOM_OS"

  test-examples:
    name: Run Examples (Java ${{ needs.select-random.outputs.java-version }} on ${{ needs.select-random.outputs.os }})
    runs-on: ${{ needs.select-random.outputs.os }}
    needs: select-random

    env:
      PDFDANCER_BASE_URL: https://api.pdfdancer.com
      JAVA_VERSION: ${{ needs.select-random.outputs.java-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java ${{ needs.select-random.outputs.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ needs.select-random.outputs.java-version }}

      - name: Set Gradle version based on Java version
        id: gradle-version
        shell: bash
        run: |
          if [ "${{ needs.select-random.outputs.java-version }}" = "11" ]; then
            echo "version=8.5" >> $GITHUB_OUTPUT
          elif [ "${{ needs.select-random.outputs.java-version }}" = "25" ]; then
            echo "version=9.2.1" >> $GITHUB_OUTPUT
          else
            echo "version=8.10.2" >> $GITHUB_OUTPUT
          fi

      - name: Cache Gradle wrapper and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ steps.gradle-version.outputs.version }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ steps.gradle-version.outputs.version }}-
            ${{ runner.os }}-gradle-

      - name: Download and set up Gradle
        shell: bash
        run: |
          GRADLE_VERSION="${{ steps.gradle-version.outputs.version }}"
          cd gradle/wrapper
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" > gradle-wrapper.properties

      - name: Grant execute permission for gradlew (Unix)
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build project
        run: ./gradlew build

      - name: Run All Examples
        run: ./gradlew runAllExamples
